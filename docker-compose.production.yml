name: ${COMPOSE_PROJECT_NAME:-moodflow-production}

x-ai: &ai
  image: moodflow/ai-service:${IMAGE_TAG:-worldline-v1-fe24b04}
  build:
    context: .
    dockerfile: deploy/ai.Dockerfile
    additional_contexts:
      wheelhouse: ./deployment-artifacts/wheelhouse
  init: true
  environment: &ai-env
    POSTGRES_DB: ${POSTGRES_DB:-moodflow_agent}
    POSTGRES_USER: ${POSTGRES_USER:-moodflow}
    DATABASE_URL: ${DATABASE_URL:-postgresql://moodflow@postgres:5432/moodflow_agent}
    SPRING_BOOT_BASE_URL: ${SPRING_BOOT_BASE_URL:-http://java:8080}
    SPRING_BOOT_TIMEOUT_SECONDS: ${SPRING_BOOT_TIMEOUT_SECONDS:-10}
    NETEASE_API_BASE_URL: ${NETEASE_API_BASE_URL:-http://netease:3000}
    QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
    LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
    LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-deepseek-flash}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
    AI_AGENT_GRAPH_MODE: foundation
    HANDOFF_CANARY_ENABLED: ${HANDOFF_CANARY_ENABLED:-false}
    CHECKPOINT_BACKEND: postgres
    PERSISTENCE_BACKEND: postgres
    MEMORY_BACKEND: postgres
    AI_RAG_RETRIEVAL_MODE: hybrid
    AI_RAG_RERANK_MODE: "off"
    AI_RAG_INDEX_MANIFEST: ${AI_RAG_INDEX_MANIFEST:-data/indexing/worldline/final-native-20260927/v4/index_build_manifest.json}
    JEV_ENABLED: ${JEV_ENABLED:-false}
    JEV_SHADOW_MODE: "true"
    JEV_ROUTER_ENABLED: "false"
    JEV_ROUTER_V4_SHADOW_ENABLED: "false"
    JEV_ROUTER_V5_SHADOW_ENABLED: ${JEV_ROUTER_V5_SHADOW_ENABLED:-false}
    JEV_MEMORY_FILTER_ENABLED: "false"
    JEV_CONTEXT_SELECT_ENABLED: "false"
    JEV_PROVIDER: typesafe
    JEV_MODEL: ${JEV_MODEL:-jev-latest}
    HF_HOME: /models
  secrets:
    - postgres_password
    - llm_api_key
    - qdrant_api_key
    - typesafe_api_key
  volumes:
    - type: bind
      source: ${INTENT_MODEL_DIR:-./deployment-artifacts/artifacts/intent_model}
      target: /app/artifacts/intent_model
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${APPROVED_RELEASE_DIR:-./deployment-artifacts/data/knowledge/releases/worldline-final-native-release-20260927/v2}
      target: /app/data/knowledge/releases/worldline-final-native-release-20260927/v2
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${APPROVED_INDEX_DIR:-./deployment-artifacts/data/indexing/worldline/final-native-20260927/v4}
      target: /app/data/indexing/worldline/final-native-20260927/v4
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${HF_CACHE_DIR:?Set HF_CACHE_DIR to the provisioned pinned model cache}
      target: /models
      read_only: true
      bind:
        create_host_path: false
  networks: [backend]

services:
  postgres:
    image: pgvector/pgvector:pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodflow_agent}
      POSTGRES_USER: ${POSTGRES_USER:-moodflow}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  qdrant:
    image: moodflow/qdrant:${IMAGE_TAG:-worldline-v1-fe24b04}
    build:
      context: .
      dockerfile: deploy/qdrant.Dockerfile
    restart: unless-stopped
    secrets: [qdrant_api_key]
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks: [backend]

  migrate:
    <<: *ai
    restart: "no"
    command: [migrate]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  netease:
    image: moodflow/netease:${IMAGE_TAG:-worldline-v1-fe24b04}
    build:
      context: .
      dockerfile: deploy/netease.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      NODE_ENV: production
      # No development proxy variables are inherited.
      ENABLE_PROXY: "false"
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  java:
    image: moodflow/java:${IMAGE_TAG:-worldline-v1-fe24b04}
    build:
      context: .
      dockerfile: deploy/java.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      NETEASE_API_BASE_URL: ${NETEASE_API_BASE_URL:-http://netease:3000}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: "true"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
    depends_on:
      netease:
        condition: service_healthy
    networks: [backend]

  ai-service:
    <<: *ai
    restart: unless-stopped
    command: [serve]
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      java:
        condition: service_healthy

  frontend:
    image: moodflow/frontend:${IMAGE_TAG:-worldline-v1-fe24b04}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8088}:80"
    depends_on:
      ai-service:
        condition: service_healthy
      java:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  qdrant_data:
  qdrant_snapshots:

networks:
  backend:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
  llm_api_key:
    file: ${LLM_API_KEY_FILE:?Set LLM_API_KEY_FILE}
  qdrant_api_key:
    file: ${QDRANT_API_KEY_FILE:?Set QDRANT_API_KEY_FILE}
  typesafe_api_key:
    file: ${TYPESAFE_API_KEY_FILE:?Set TYPESAFE_API_KEY_FILE}
