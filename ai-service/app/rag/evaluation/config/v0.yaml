schema_version: v0
expected_case_count: 50
minimum_approved_cases: 30

# These boundaries match the current online pipeline. Quality thresholds are set
# only after the first approved baseline; structural safety gates are fixed now.
candidate_top_k: 40
rerank_top_k: 12
context_top_k: 8
citation_id_validity_threshold: 1.0
token_budget_compliance_threshold: 1.0

# Judge evaluation is explicit/nightly, never part of ordinary unit tests.
judge_enabled_by_default: false
judge_metrics:
  - name: faithfulness
    threshold: 0.5
  - name: answer_relevancy
    threshold: 0.5
  - name: contextual_precision
    threshold: 0.5
  - name: contextual_recall
    threshold: 0.5
