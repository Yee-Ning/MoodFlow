# ECS edge proxy for the Let's Encrypt short-lived IP certificate.
server {
    listen 80 default_server;
    server_name 47.83.162.191;
    server_tokens off;

    # Certbot webroot must remain reachable on port 80 during renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/moodflow-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://47.83.162.191$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 47.83.162.191;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/47.83.162.191/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.83.162.191/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:moodflow_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /api/ai/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
